name: Build ARM64 Theme Package

on:
  workflow_dispatch:
    inputs:
      tag:
        description: 'Release tag (e.g. v1.0.0)'
        required: true
        default: 'v1.0.0'

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Install dpkg tools
        run: sudo apt-get install -y dpkg

      - name: Set file permissions
        run: |
          chmod -R 0755 MyThemeRootless/DEBIAN
          chmod 0755 MyThemeRootless/DEBIAN/postinst
          chmod -R 0755 MyThemeRootless/var

      - name: Clean macOS metadata
        run: find MyThemeRootless -name ".DS_Store" -type f -delete

      - name: Build .deb package
        run: dpkg-deb -b -Zxz MyThemeRootless com.z.darkthemeaddon_${{ github.event.inputs.tag }}_iphoneos-arm64.deb

      - name: Create GitHub Release and upload .deb
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ github.event.inputs.tag }}
          name: "Z's Dark Theme Addon ${{ github.event.inputs.tag }}"
          body: |
            ## Z's Dark Theme Addon ${{ github.event.inputs.tag }}
            
            Rootless dark theme for Brightspace Pulse, StudentSquare, StudentVUE, MeloNX, and OCC Safe.
            
            ### Install
            Download the `.deb` below and open with Sileo, or add this repo to Sileo.
          files: com.z.darkthemeaddon_${{ github.event.inputs.tag }}_iphoneos-arm64.deb
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
